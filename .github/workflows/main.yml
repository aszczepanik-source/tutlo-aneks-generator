name: Check and deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Create private frontend configuration
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          node --input-type=module <<'EOF'
          import { writeFile } from 'node:fs/promises';

          const endpoint = process.env.APPS_SCRIPT_URL;
          if (!endpoint) throw new Error('Brak wymaganego sekretu APPS_SCRIPT_URL.');

          const url = new URL(endpoint);
          if (url.protocol !== 'https:' || url.hostname !== 'script.google.com') {
            throw new Error('APPS_SCRIPT_URL musi być adresem HTTPS w domenie script.google.com.');
          }

          await writeFile('config.js', `export const APPS_SCRIPT_URL = ${JSON.stringify(endpoint)};\n`);
          EOF

      - name: Build release
        run: npm run build

      - name: Run tests
        run: |
          if ! npm test > test-results.log 2>&1; then
            echo 'Błąd: testy zakończyły się niepowodzeniem; szczegóły pozostają ukryte, aby nie ujawnić endpointu.' >&2
            exit 1
          fi
          echo 'Testy zakończone powodzeniem.'

      - name: Verify release endpoint configuration
        run: |
          if grep -R -F -q 'UZUPELNIJ_LOKALNIE' dist; then
            echo 'Błąd: dist zawiera placeholder endpointu.' >&2
            exit 1
          fi
          if ! grep -R -F -q 'script.google.com' dist; then
            echo 'Błąd: dist nie zawiera skonfigurowanej domeny Apps Script.' >&2
            exit 1
          fi

      - name: Generate ZIP archive
        run: |
          rm -f tutlo-aneks-generator-1.0.0.zip
          zip -qr tutlo-aneks-generator-1.0.0.zip dist

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: tutlo-aneks-generator-1.0.0
          path: tutlo-aneks-generator-1.0.0.zip
          if-no-files-found: error

      - name: Prepare GitHub Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R dist/. _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
