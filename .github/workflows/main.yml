name: Check and deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build release
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify Pages build contents
        run: |
          for annex in 11 25 26; do
            if [ ! -s "dist/src/annexes/$annex/template.docx" ]; then
              echo "Błąd: brak szablonu aneksu $annex w dist lub plik jest pusty." >&2
              exit 1
            fi
          done
          if grep -R -F -q 'UZUPELNIJ_LOKALNIE' \
            --include='*.html' --include='*.js' \
            dist/index.html dist/router.js dist/src; then
            echo 'Błąd: aktywny kod aplikacji zawiera placeholder UZUPELNIJ_LOKALNIE.' >&2
            exit 1
          fi

      - name: Generate ZIP archive
        run: |
          rm -f tutlo-aneks-generator-1.0.0.zip
          zip -qr tutlo-aneks-generator-1.0.0.zip dist

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: tutlo-aneks-generator-1.0.0
          path: tutlo-aneks-generator-1.0.0.zip
          if-no-files-found: error

      - name: Prepare GitHub Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R dist/. _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
